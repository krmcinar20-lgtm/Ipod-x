
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>iPod X</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090b;color:white;font-family:Arial,sans-serif}
#app{height:100dvh;width:100%;display:flex;flex-direction:column;background:linear-gradient(145deg,#333943,#090a0d 45%,#171b20);padding:clamp(10px,3vw,24px);overflow:hidden}
header{height:38px;display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:3px;font-weight:bold}
header span:last-child{color:#aab2be;font-size:10px}
#screen{flex:1;min-height:0;background:linear-gradient(145deg,#eef1f5,#abb4c0);color:#151a22;border:5px solid #050607;border-radius:12px;box-shadow:inset 0 0 25px #3335;overflow:hidden;display:flex;flex-direction:column}
#statusbar{height:32px;background:linear-gradient(#fff,#b9c1cc);border-bottom:1px solid #858e9b;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;font-weight:bold}
#content{padding:13px;overflow:auto;flex:1}
h2{font-size:19px;margin:5px 0 13px}
.item{padding:13px 10px;border-bottom:1px solid #858e9b;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:bold;cursor:pointer}
.item.selected,.item:active{background:#344052;color:white}
.item small{font-size:10px;font-weight:normal}
.arrow{font-size:20px}
.now-art{width:min(48vw,190px);aspect-ratio:1;margin:12px auto;background:linear-gradient(135deg,#202a38,#8996a8,#171c25);border:4px solid #f6f7f8;box-shadow:0 4px 12px #3336;display:grid;place-items:center;color:white;font-size:48px}
.center{text-align:center}
#songTitle{font-size:20px;font-weight:bold;margin:12px 0 5px;overflow-wrap:anywhere}
#artist{font-size:12px;color:#424b59}
.times{display:flex;justify-content:space-between;font-size:10px;margin-top:12px}
input[type=range]{width:100%;accent-color:#303c4c}
button{cursor:pointer}
.action{background:linear-gradient(#fff,#aeb7c2);color:#151a22;border:1px solid #78818d;border-radius:6px;padding:10px;font-weight:bold}
.action:active{filter:brightness(.85)}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1}
.info{font-size:12px;color:#46505d;line-height:1.6}
.wheel-wrap{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vh,25px) 0}
#wheel{width:min(58vw,270px);height:min(58vw,270px);max-height:32vh;max-width:32vh;min-width:190px;min-height:190px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 25%,#fff,#e2e5e9 35%,#aeb6c0 68%,#f5f6f8 73%,#747d88 80%,#d7dce2 100%);box-shadow:0 8px 25px #000b,inset 0 2px 5px white;border:1px solid #69717c}
#wheel button{position:absolute;border:0;background:transparent;color:#303945;font-weight:bold}
#menu{top:9%;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:2px}
#prev{left:7%;top:47%;font-size:21px}
#next{right:7%;top:47%;font-size:21px}
#play{bottom:8%;left:50%;transform:translateX(-50%);font-size:17px}
#select{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:39%;height:39%;border-radius:50%;background:linear-gradient(145deg,#fff,#b6bec8);border:1px solid #77818e;font-size:11px;box-shadow:0 2px 7px #3335}
footer{text-align:center;color:#9aa3af;font-size:9px;letter-spacing:3px;padding-bottom:3px}
.hidden{display:none!important}
#file{display:none}
</style>
</head>
<body>
<div id="app">
<header><span>◉ iPod X</span><span id="clock">MUSIC SYSTEM</span></header>
<section id="screen">
<div id="statusbar"><span id="screenName">MAIN MENU</span><span>● PLAY ▰</span></div>
<div id="content"></div>
</section>
<div class="wheel-wrap">
<div id="wheel">
<button id="menu">MENU</button>
<button id="prev">|◀</button>
<button id="next">▶|</button>
<button id="play">▶ / ❚❚</button>
<button id="select">SELECT</button>
</div>
</div>
<footer>CLASSIC MUSIC EXPERIENCE</footer>
<input id="file" type="file" accept="audio/*" multiple>
<audio id="audio"></audio>
</div>
<script>
const $=id=>document.getElementById(id);
const content=$('content'),audio=$('audio');
let page='home',songs=[],current=-1,playlists=[],activePlaylist=-1,repeat=0,shuffle=false;

function render(){
 $('screenName').textContent=page.toUpperCase().replace('NOW','NOW');
 content.innerHTML='';
 if(page==='home'){
  heading('iPod X');
  menuItem('Music','music');
  menuItem('Playlists','playlists');
  menuItem('Now Playing','now');
  menuItem('Settings','settings');
 }
 if(page==='music'){
  heading('MUSIC');
  menuItem('All Songs','songs');
  menuItem('Albums','albums');
  menuItem('Artists','artists');
  menuItem('Add Music','add');
 }
 if(page==='songs'){
  heading('ALL SONGS');
  if(!songs.length)message('Your library is empty. Add music from the Music menu.');
  songs.forEach((s,i)=>trackItem(s.name,()=>playSong(i),i===current?'♪':'▶'));
  button('＋ ADD MUSIC',addMusic);
 }
 if(page==='albums'){
  heading('ALBUMS');
  if(!songs.length)message('No albums yet. Add your music.');
  else songs.forEach((s,i)=>trackItem(s.name,()=>playSong(i),'♫'));
 }
 if(page==='artists'){
  heading('ARTISTS');
  if(!songs.length)message('No artists yet. Add your music.');
  else songs.forEach((s,i)=>trackItem('Unknown Artist',()=>playSong(i),'›'));
 }
 if(page==='playlists'){
  heading('PLAYLISTS');
  button('＋ CREATE PLAYLIST',createPlaylist);
  playlists.forEach((p,i)=>menuItem(p.name,'playlist:'+i));
  if(!playlists.length)message('Create your first playlist.');
 }
 if(page.startsWith('playlist:')){
  activePlaylist=Number(page.split(':')[1]);
  const p=playlists[activePlaylist];
  heading(p.name);
  button('＋ ADD SONG TO PLAYLIST',()=>addToPlaylist(activePlaylist));
  p.songs.forEach(i=>{if(songs[i])trackItem(songs[i].name,()=>playSong(i),'♪')});
  if(!p.songs.length)message('This playlist is empty.');
 }
 if(page==='now')nowPlaying();
 if(page==='settings'){
  heading('SETTINGS');
  menuItem('Silver theme','theme');
  menuItem('Blue theme','blue');
  menuItem('Pink theme','pink');
  menuItem('Clear music library','clear');
  message('Your music files stay on your device.');
 }
 if(page==='theme'||page==='blue'||page==='pink'){
  const colors={theme:'#d7dce2',blue:'#a8d8ff',pink:'#ffb7c5'};
  $('wheel').style.filter='drop-shadow(0 0 8px '+colors[page]+')';
  page='settings';render();
 }
}
function heading(t){const h=document.createElement('h2');h.textContent=t;content.append(h)}
function message(t){const p=document.createElement('p');p.className='info';p.textContent=t;content.append(p)}
function menuItem(t,target){
 const d=document.createElement('div');d.className='item';d.innerHTML='<span></span><span class="arrow">›</span>';d.firstChild.textContent=t;
 d.onclick=()=>{if(target==='add')addMusic();else if(target==='clear')clearMusic();else{page=target;render()}};content.append(d);
}
function trackItem(t,fn,icon){
 const d=document.createElement('div');d.className='item';
 const name=document.createElement('span');name.textContent=t;
 const right=document.createElement('small');right.textContent=icon;
 d.append(name,right);d.onclick=fn;content.append(d);
}
function button(t,fn){
 const b=document.createElement('button');b.className='action';b.textContent=t;b.style.width='100%';b.style.margin='5px 0';b.onclick=fn;content.append(b);
}
function addMusic(){$('file').click()}
$('file').onchange=e=>{
 [...e.target.files].forEach(f=>{
  if(!f.type.startsWith('audio/'))return;
  songs.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)});
 });
 render();e.target.value='';
};
function playSong(i){
 if(!songs[i])return;
 current=i;audio.src=songs[i].url;audio.play().catch(()=>{});
 page='now';render();
}
function nowPlaying(){
 heading('NOW PLAYING');
 const art=document.createElement('div');art.className='now-art';art.textContent='♫';content.append(art);
 const title=document.createElement('div');title.id='songTitle';title.className='center';title.textContent=songs[current]?.name||'No song selected';content.append(title);
 const artist=document.createElement('div');artist.id='artist';artist.className='center';artist.textContent='LOCAL MUSIC';content.append(artist);
 const times=document.createElement('div');times.className='times';times.innerHTML='<span id="elapsed">0:00</span><span id="duration">0:00</span>';content.append(times);
 const seek=document.createElement('input');seek.type='range';seek.min=0;seek.max=1000;seek.value=0;seek.style.width='100%';seek.id='seek';seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration};content.append(seek);
 const controls=document.createElement('div');controls.className='row';
 ['|◀','▶ / ❚❚','▶|'].forEach((t,i)=>{const b=document.createElement('button');b.className='action';b.textContent=t;b.onclick=[previous,toggle,next][i];controls.append(b)});
 content.append(controls);
 button(shuffle?'SHUFFLE: ON':'SHUFFLE: OFF',()=>{shuffle=!shuffle;render()});
 button(['REPEAT: OFF','REPEAT: ALL','REPEAT: ONE'][repeat],()=>{repeat=(repeat+1)%3;render()});
}
function createPlaylist(){
 const name=prompt('Playlist name:');
 if(!name||!name.trim())return;
 playlists.push({name:name.trim(),songs:[]});
 render();
}
function addToPlaylist(i){
 if(!songs.length){alert('First add music to your library.');return}
 const n=prompt('Enter song number to add:\n'+songs.map((s,j)=>(j+1)+'. '+s.name).join('\n'));
 const num=Number(n)-1;
 if(Number.isInteger(num)&&songs[num]&&!playlists[i].songs.includes(num))playlists[i].songs.push(num);
 render();
}
function toggle(){if(current<0){if(songs.length)playSong(0);return}if(audio.paused)audio.play();else audio.pause()}
function next(){
 if(!songs.length)return;
 let i=current;
 if(shuffle&&songs.length>1)while(i===current)i=Math.floor(Math.random()*songs.length);
 else i=(current+1)%songs.length;
 playSong(i);
}
function previous(){if(current<0)return;if(audio.currentTime>3)audio.currentTime=0;else playSong((current-1+songs.length)%songs.length)}
function clearMusic(){
 if(!confirm('Clear all songs and playlists?'))return;
 audio.pause();audio.removeAttribute('src');audio.load();
 songs.forEach(s=>URL.revokeObjectURL(s.url));songs=[];playlists=[];current=-1;page='home';render();
}
$('menu').onclick=()=>{page='home';render()};
$('select').onclick=()=>{if(page==='home')page='music';else if(page==='music')page='songs';else if(page==='now')toggle();else if(page==='playlists')createPlaylist();render()};
$('play').onclick=toggle;
$('next').onclick=next;
$('prev').onclick=previous;
audio.ontimeupdate=()=>{
 const elapsed=$('elapsed'),duration=$('duration'),seek=$('seek');
 if(elapsed)elapsed.textContent=fmt(audio.currentTime);
 if(duration&&Number.isFinite(audio.duration))duration.textContent=fmt(audio.duration);
 if(seek&&audio.duration)seek.value=audio.currentTime/audio.duration*1000;
};
audio.onended=()=>{if(repeat===2){audio.currentTime=0;audio.play()}else if(repeat===1||current<songs.length-1)next()};
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
render();
</script>
</body>
</html>
