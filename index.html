
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#171717">
<title>iPod X</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;padding:0;width:100%;height:100%;
 overflow:hidden;background:#171717;
 font-family:Arial,sans-serif;touch-action:pan-y;
}
#app{
 width:100%;height:100vh;height:100dvh;
 min-height:0;display:flex;flex-direction:column;
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
 background:linear-gradient(135deg,#777,#222 30%,#080808 75%,#777);
}
#screen{
 flex:0 0 40%;min-height:0;
 margin:8px 9px 4px;
 border:4px solid #777;border-radius:7px;
 background:linear-gradient(#e8e9e9,#a6abb0);
 color:#111;overflow:hidden;
 box-shadow:inset 0 0 8px #333,0 3px 8px #000;
}
#status{
 height:21px;background:#333;color:white;
 padding:3px 8px;font-size:11px;
 display:flex;justify-content:space-between;
}
#header{
 height:36px;padding:8px 10px;
 font-size:18px;font-weight:bold;
 background:linear-gradient(#fafafa,#b7bdc2);
 border-bottom:1px solid #777;
}
#content{
 height:calc(100% - 57px);
 overflow-y:auto;overscroll-behavior:contain;
}
.item{
 height:39px;padding:0 10px;
 display:flex;align-items:center;justify-content:space-between;
 border-bottom:1px solid #999;font-size:14px;
}
.item.selected{
 color:white;background:linear-gradient(#3987df,#0752a5);
}
#wheelArea{
 flex:1;min-height:0;
 display:flex;align-items:center;justify-content:center;
 padding:8px 0 12px;
}
#wheel{
 width:min(76vw,calc(100% - 50px),310px);
 max-height:100%;aspect-ratio:1;
 border-radius:50%;position:relative;
 background:linear-gradient(145deg,#fff,#bfc2c5 45%,#eee 75%,#777);
 box-shadow:0 8px 20px #000,inset 0 3px 7px white,inset 0 -4px 8px #555;
 touch-action:none;user-select:none;
}
.wheelText{
 position:absolute;color:#303438;
 font-weight:bold;font-size:14px;
}
#menuBtn{top:12%;left:50%;transform:translateX(-50%)}
#prev{left:12%;top:50%;transform:translateY(-50%);font-size:21px}
#next{right:12%;top:50%;transform:translateY(-50%);font-size:21px}
#play{bottom:12%;left:50%;transform:translateX(-50%);font-size:19px}
#center{
 position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);
 width:43%;height:43%;border-radius:50%;
 background:linear-gradient(145deg,#f1f1f1,#aaa);
 border:1px solid #888;
 box-shadow:inset 0 3px 7px white,inset 0 -3px 7px #666;
}
#center:active{background:#bbb}
#file{display:none}
#toast{
 display:none;position:fixed;bottom:8px;left:50%;
 transform:translateX(-50%);background:#222;color:white;
 border-radius:18px;padding:9px 14px;font-size:12px;
 z-index:5;
}
.small{font-size:11px;color:#333}
#progress{width:100%;accent-color:#333}
</style>
</head>
<body>
<div id="app">
 <div id="screen">
  <div id="status"><span>● iPod X</span><span id="clock">--:-- ▰</span></div>
  <div id="header">iPod</div>
  <div id="content"></div>
 </div>
 <div id="wheelArea">
  <div id="wheel">
   <div class="wheelText" id="menuBtn">MENU</div>
   <div class="wheelText" id="prev">◀◀</div>
   <div class="wheelText" id="next">▶▶</div>
   <div class="wheelText" id="play">▶Ⅱ</div>
   <div id="center"></div>
  </div>
 </div>
 <input type="file" id="file" accept="audio/*" multiple>
</div>
<div id="toast"></div>
<audio id="audio"></audio>

<script>
const $=id=>document.getElementById(id);
const audio=$("audio");
let songs=[],playlists=[],current=0,screen="home",selected=0;
let shuffle=false,repeat=false,playing=false;
let lastAngle=null,rotation=0;

const menus={
 home:["Music","Playlists","Now Playing","Settings"],
 music:["All Songs","Albums","Artists","Add Music"],
 settings:["Shuffle","Repeat","About"]
};

function toast(s){
 $("toast").textContent=s;
 $("toast").style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>$("toast").style.display="none",1700);
}
function go(s){screen=s;selected=0;render()}
function back(){
 if(screen==="home")return;
 if(screen==="music"||screen==="playlists"||screen==="settings"||screen==="now"||screen==="songs"||screen==="albums"||screen==="artists")go("home");
 else if(screen.startsWith("playlist:"))go("playlists");
}
function showList(t,items){
 $("header").textContent=t;
 let c=$("content");c.innerHTML="";
 if(!items.length){
  c.innerHTML='<div class="item">Henüz içerik yok</div>';return;
 }
 items.forEach((v,i)=>{
  let d=document.createElement("div");
  d.className="item"+(i===selected?" selected":"");
  let a=document.createElement("span");a.textContent=v;
  let b=document.createElement("span");b.textContent="›";
  d.append(a,b);
  d.onclick=()=>{selected=i;render();activate()};
  c.append(d);
 });
}
function render(){
 if(screen==="home")showList("iPod",menus.home);
 else if(screen==="music")showList("Music",menus.music);
 else if(screen==="songs")showList("All Songs",songs.map(s=>s.name));
 else if(screen==="playlists")showList("Playlists",["＋ Create Playlist",...playlists.map(p=>p.name)]);
 else if(screen.startsWith("playlist:")){
  let p=playlists[+screen.split(":")[1]];
  showList(p.name,p.songs.map(i=>songs[i]?.name||"Unknown"));
 }else if(screen==="settings"){
  showList("Settings",["Shuffle "+(shuffle?"✓":""),"Repeat "+(repeat?"✓":""),"About"]);
 }else if(screen==="albums"){
  showList("Albums",[...new Set(songs.map(s=>s.album||"Unknown album"))]);
 }else if(screen==="artists"){
  showList("Artists",[...new Set(songs.map(s=>s.artist||"Unknown artist"))]);
 }else if(screen==="now")nowPlaying();
}
function activate(){
 if(screen==="home"){
  ["music","playlists","now","settings"][selected]&&go(["music","playlists","now","settings"][selected]);
 }else if(screen==="music"){
  ["songs","albums","artists"][selected]&&go(["songs","albums","artists"][selected]);
  if(selected===3)$("file").click();
 }else if(screen==="songs")playSong(selected);
 else if(screen==="playlists"){
  if(selected===0){
   let n=prompt("Playlist adı:");
   if(n){playlists.push({name:n,songs:[]});render()}
  }else go("playlist:"+(selected-1));
 }else if(screen.startsWith("playlist:")){
  let p=playlists[+screen.split(":")[1]];
  if(p.songs[selected]!==undefined)playSong(p.songs[selected]);
 }else if(screen==="settings"){
  if(selected===0)shuffle=!shuffle;
  if(selected===1)repeat=!repeat;
  render();
 }else if(screen==="albums"||screen==="artists"){
  toast("All Songs bölümünden şarkı seç");
 }
}
function playSong(i){
 if(!songs[i])return;
 current=i;audio.src=songs[i].url;
 audio.play().then(()=>playing=true).catch(()=>toast("Müzik açılamadı"));
 go("now");
}
function next(){
 if(!songs.length)return;
 current=shuffle?Math.floor(Math.random()*songs.length):(current+1)%songs.length;
 playSong(current);
}
function previous(){
 if(audio.currentTime>3){audio.currentTime=0;return}
 current=(current-1+songs.length)%songs.length;playSong(current);
}
function fmt(t){
 if(!isFinite(t))return"0:00";
 return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
}
function nowPlaying(){
 $("header").textContent="Now Playing";
 let s=songs[current];
 if(!s){$("content").innerHTML='<div class="item">Önce müzik ekle</div>';return}
 $("content").innerHTML=`
 <div style="padding:12px;display:flex;gap:12px;align-items:center">
 <div style="width:58px;height:58px;background:#333;color:white;display:grid;place-items:center;font-size:27px">♫</div>
 <div style="min-width:0"><b id="songName" style="overflow-wrap:anywhere"></b><div class="small">iPod X</div></div></div>
 <div style="padding:8px 12px">
 <input id="progress" type="range" min="0" max="100" value="0">
 <div class="small" style="display:flex;justify-content:space-between"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
 </div>
 <div style="text-align:center;padding:8px;font-size:19px">⏮　${playing?"Ⅱ":"▶"}　⏭</div>`;
 $("songName").textContent=s.name;
 $("progress").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
}
$("file").onchange=e=>{
 [...e.target.files].forEach(f=>songs.push({name:f.name,url:URL.createObjectURL(f)}));
 toast("Müzikler eklendi");go("songs");
};
$("menuBtn").onclick=back;
$("center").onclick=activate;
$("next").onclick=next;
$("prev").onclick=previous;
$("play").onclick=()=>{
 if(!songs.length){$("file").click();return}
 if(audio.paused){audio.play();playing=true}
 else{audio.pause();playing=false}
 if(screen==="now")render();
};
audio.onended=()=>{if(repeat){audio.currentTime=0;audio.play()}else next()};
audio.ontimeupdate=()=>{
 let p=$("progress");
 if(p&&audio.duration){
  p.value=audio.currentTime/audio.duration*100;
  $("elapsed").textContent=fmt(audio.currentTime);
  $("duration").textContent=fmt(audio.duration);
 }
};
$("wheel").addEventListener("pointerdown",e=>{
 if(e.target.closest(".wheelText")||e.target.id==="center")return;
 let r=$("wheel").getBoundingClientRect();
 lastAngle=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);
 $("wheel").setPointerCapture(e.pointerId);
});
$("wheel").addEventListener("pointermove",e=>{
 if(lastAngle===null)return;
 let r=$("wheel").getBoundingClientRect();
 let a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);
 let d=a-lastAngle;
 if(d>Math.PI)d-=2*Math.PI;
 if(d< -Math.PI)d+=2*Math.PI;
 rotation+=d;lastAngle=a;
 if(Math.abs(rotation)>.4){
  let count=$("content").querySelectorAll(".item").length;
  if(count){
   selected=(selected+(rotation>0?1:-1)+count)%count;
   render();
  }
  rotation=0;
 }
});
$("wheel").addEventListener("pointerup",()=>lastAngle=null);
$("wheel").addEventListener("pointercancel",()=>lastAngle=null);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowDown"){selected++;render()}
 if(e.key==="ArrowUp"){selected=Math.max(0,selected-1);render()}
 if(e.key==="Enter")activate();
 if(e.key==="Escape")back();
});
function clock(){
 $("clock").textContent=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+" ▰";
}
clock();setInterval(clock,10000);
render();
</script>
</body>
</html>
