
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>iPod X</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:white;font-family:Arial,sans-serif;touch-action:manipulation}
#app{height:100dvh;width:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:linear-gradient(145deg,#555,#171717 35%,#080808 75%,#444)}
#screen{margin:12px 12px 8px;height:36%;min-height:190px;border:5px solid #777;border-radius:8px;background:linear-gradient(#e9edf0,#9da4aa);color:#111;overflow:hidden;box-shadow:inset 0 0 12px #333,0 4px 10px #000}
#status{height:24px;background:#30343a;color:white;padding:4px 9px;font-size:11px;display:flex;justify-content:space-between}
#header{padding:9px 12px;font-weight:bold;font-size:19px;border-bottom:1px solid #777;background:linear-gradient(#f5f5f5,#adb3b9)}
#content{height:calc(100% - 55px);overflow:auto}
.item{padding:10px 12px;border-bottom:1px solid #888;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.item.selected{background:linear-gradient(#347bd0,#0750a3);color:white}
#wheelArea{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#wheel{width:min(78vw,340px,48vh);aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#f9f9f9,#aeb2b6 45%,#ededed 75%,#888);box-shadow:0 10px 28px #000, inset 0 3px 8px white,inset 0 -5px 9px #555;position:relative;touch-action:none;user-select:none}
.wheelText{position:absolute;color:#34383c;font-weight:bold;font-size:clamp(12px,3.5vw,16px)}
#menuBtn{top:12%;left:50%;transform:translateX(-50%)}
#prev{left:12%;top:50%;transform:translateY(-50%);font-size:24px}
#next{right:12%;top:50%;transform:translateY(-50%);font-size:24px}
#play{bottom:12%;left:50%;transform:translateX(-50%);font-size:20px}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:43%;height:43%;border-radius:50%;border:1px solid #888;background:linear-gradient(145deg,#eee,#aeb2b6);box-shadow:inset 0 3px 8px white,inset 0 -3px 7px #666}
button{font:inherit;cursor:pointer}
#center:active,.wheelText:active{opacity:.6}
#file{display:none}
#toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:9px 15px;border-radius:20px;font-size:12px;display:none;z-index:10}
#nowArt{height:65px;width:65px;background:linear-gradient(135deg,#555,#111);border:2px solid #555;display:grid;place-items:center;color:white;font-size:26px}
#progress{width:100%;accent-color:#333}
.small{font-size:12px;color:#333}
</style>
</head>
<body>
<div id="app">
 <div id="screen">
  <div id="status"><span>◉ iPod X</span><span id="clock">18:00 ▰</span></div>
  <div id="header">iPod</div>
  <div id="content"></div>
 </div>
 <div id="wheelArea">
  <div id="wheel">
   <div class="wheelText" id="menuBtn">MENU</div>
   <div class="wheelText" id="prev">◀◀</div>
   <div class="wheelText" id="next">▶▶</div>
   <div class="wheelText" id="play">▶Ⅱ</div>
   <div id="center"></div>
  </div>
 </div>
 <input type="file" id="file" accept="audio/*" multiple>
</div>
<div id="toast"></div>
<audio id="audio"></audio>
<script>
const $=id=>document.getElementById(id);
const audio=$("audio");
let songs=[],playlists=[],current=0,screen="home",selected=0,queue=[],rotation=0,lastAngle=null;
let playing=false,shuffle=false,repeat=false;
const menus={
 home:["Music","Playlists","Now Playing","Settings"],
 music:["All Songs","Albums","Artists","Add Music"],
 settings:["Shuffle","Repeat","About"]
};
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
function title(t){$("header").textContent=t}
function go(s){screen=s;selected=0;render()}
function render(){
 const c=$("content");c.innerHTML="";
 if(screen==="home")showList("iPod",menus.home);
 else if(screen==="music")showList("Music",menus.music);
 else if(screen==="songs")showList("All Songs",songs.map(s=>s.name));
 else if(screen==="playlists")showList("Playlists",["＋ Create Playlist",...playlists.map(p=>p.name)]);
 else if(screen.startsWith("playlist:")){
  let p=playlists[+screen.split(":")[1]];
  showList(p.name,p.songs.map(i=>songs[i]?.name||"Unknown"));
 }else if(screen==="settings")showList("Settings",menus.settings.map((x,i)=>x+(i===0?(shuffle?" ✓":""):i===1?(repeat?" ✓":""):"")));
 else if(screen==="now")nowPlaying();
 else if(screen==="albums")showList("Albums",[...new Set(songs.map(s=>s.album||"Unknown album"))]);
 else if(screen==="artists")showList("Artists",[...new Set(songs.map(s=>s.artist||"Unknown artist"))]);
}
function showList(t,items){
 title(t);
 if(!items.length){let d=document.createElement("div");d.className="item";d.textContent="Nothing here yet";$("content").append(d);return}
 items.forEach((v,i)=>{
 let d=document.createElement("div");d.className="item"+(i===selected?" selected":"");
 d.innerHTML="<span></span><span>›</span>";d.firstChild.textContent=v;
 d.onclick=()=>{selected=i;render();activate()};
 $("content").append(d);
 });
}
function nowPlaying(){
 title("Now Playing");
 let s=songs[current];
 if(!s){$("content").innerHTML='<div class="item">Add music to begin</div>';return}
 $("content").innerHTML='<div style="padding:12px;display:flex;gap:12px;align-items:center"><div id="nowArt">♫</div><div><b id="songName"></b><div class="small">iPod X Music</div></div></div><div style="padding:8px 12px"><input id="progress" type="range" min="0" max="100" value="0"><div style="display:flex;justify-content:space-between" class="small"><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div><div style="text-align:center;padding:10px;font-size:20px">⏮　<span id="playState">▶</span>　⏭</div>';
 $("songName").textContent=s.name;
 $("playState").textContent=playing?"Ⅱ":"▶";
 $("content").querySelector("#progress").oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};
}
function activate(){
 if(screen==="home"){
  if(selected===0)go("music");
  if(selected===1)go("playlists");
  if(selected===2)go("now");
  if(selected===3)go("settings");
 }else if(screen==="music"){
  if(selected===0)go("songs");
  if(selected===1)go("albums");
  if(selected===2)go("artists");
  if(selected===3)$("file").click();
 }else if(screen==="songs"){
  playSong(selected);
 }else if(screen==="playlists"){
  if(selected===0)createPlaylist();
  else go("playlist:"+(selected-1));
 }else if(screen.startsWith("playlist:")){
  let p=playlists[+screen.split(":")[1]];
  let index=p.songs[selected];if(index!==undefined)playSong(index);
 }else if(screen==="settings"){
  if(selected===0){shuffle=!shuffle;toast("Shuffle "+(shuffle?"ON":"OFF"))}
  if(selected===1){repeat=!repeat;toast("Repeat "+(repeat?"ON":"OFF"))}
  render();
 }else if(screen==="albums"||screen==="artists"){
  toast("Select a song from All Songs");
 }
}
function createPlaylist(){
 let name=prompt("Playlist name:");
 if(!name)return;
 playlists.push({name,songs:[]});
 render();toast("Playlist created");
}
function playSong(i){
 if(!songs[i])return;
 current=i;audio.src=songs[i].url;audio.play().then(()=>playing=true).catch(()=>toast("Playback error"));
 screen="now";render();
}
function next(){
 if(!songs.length)return;
 current=shuffle?Math.floor(Math.random()*songs.length):(current+1)%songs.length;
 playSong(current);
}
function previous(){
 if(audio.currentTime>3){audio.currentTime=0;return}
 current=(current-1+songs.length)%songs.length;playSong(current);
}
function back(){
 if(screen==="home")return;
 if(screen==="music"||screen==="playlists"||screen==="settings"||screen==="now"||screen==="songs"||screen==="albums"||screen==="artists")go("home");
 else if(screen.startsWith("playlist:"))go("playlists");
}
$("menuBtn").onclick=back;
$("center").onclick=activate;
$("next").onclick=next;
$("prev").onclick=previous;
$("play").onclick=()=>{
 if(!songs.length){$("file").click();return}
 if(audio.paused){audio.play();playing=true}else{audio.pause();playing=false}
 if(screen==="now")render();
};
$("file").onchange=e=>{
 [...e.target.files].forEach(f=>songs.push({name:f.name,url:URL.createObjectURL(f)}));
 toast(e.target.files.length+" songs added");
 go("songs");
};
audio.onended=()=>{if(repeat)audio.currentTime=0,audio.play();else next()};
audio.ontimeupdate=()=>{
 let p=$("progress");if(p&&audio.duration){
 p.value=audio.currentTime/audio.duration*100;
 $("elapsed").textContent=fmt(audio.currentTime);
 $("duration").textContent=fmt(audio.duration);
 }};
function fmt(t){if(!isFinite(t))return"0:00";return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0")}
$("wheel").addEventListener("pointerdown",e=>{
 if(e.target.closest(".wheelText")||e.target.id==="center")return;
 $("wheel").setPointerCapture(e.pointerId);
 let r=$("wheel").getBoundingClientRect();
 lastAngle=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);
});
$("wheel").addEventListener("pointermove",e=>{
 if(lastAngle===null)return;
 let r=$("wheel").getBoundingClientRect();
 let a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);
 let diff=a-lastAngle;
 if(diff>Math.PI)diff-=2*Math.PI;
 if(diff< -Math.PI)diff+=2*Math.PI;
 rotation+=diff;lastAngle=a;
 if(Math.abs(rotation)>.45){
  let dir=rotation>0?1:-1;
  let items=$("content").querySelectorAll(".item");
  if(items.length){selected=(selected+dir+items.length)%items.length;render()}
  rotation=0;
 }
});
$("wheel").addEventListener("pointerup",()=>lastAngle=null);
$("wheel").addEventListener("pointercancel",()=>lastAngle=null);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowDown"){selected++;render()}
 if(e.key==="ArrowUp"){selected=Math.max(0,selected-1);render()}
 if(e.key==="Enter")activate();
 if(e.key==="Escape")back();
});
setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})+" ▰",10000);
render();
</script>
</body>
</html>
